<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DD Game Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{overflow:hidden;transition:background 0.3s,color 0.3s}
body.light{background:#f8f8f8;color:#111}
body.dark{background:#121212;color:#eee}

/* 主页面 */
#mainPage{position:fixed;inset:0;display:block}
#viewWrap{width:100vw;height:100vh;overflow:hidden;touch-action:none}
#scene{
  position:absolute;
  width:120vw;height:120vh;
  left:-10vw;top:-10vh;
  background:linear-gradient(#27293d,#141520);
  transition: transform 0.24s cubic-bezier(0.17, 0.67, 0.25, 1);
}
.villaBg{
  position:absolute;
  width:420px;height:320px;
  left:50%;top:40%;
  transform:translate(-50%,-50%);
  background:#3a3c52;
  border:4px solid #222;
  border-radius:8px;
}
.monsterSprite{
  position:absolute;
  width:110px;height:160px;
  right:12%;top:35%;
  background:#0a0a0a;
  border-radius:6px;
}

#menuUi{position:absolute;inset:0;pointer-events:none}
#menuUi > *{pointer-events:auto}
.topBar{position:absolute;top:14px;right:14px}
.topLeftBar{position:absolute;top:14px;left:14px;display:flex;gap:6px;flex-wrap:wrap;max-width:75vw}
.btn{padding:9px 16px;margin:4px;border:none;border-radius:6px;font-size:14px}
.btnBlue{background:#2563eb;color:#fff}
.btnGray{background:#444654;color:#fff}
.mainButtons{
  position:absolute;
  left:8%;top:50%;
  transform:translateY(-50%);
  display:flex;flex-direction:column;gap:14px;
}

/* 设置弹窗 */
#settingModal{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.65);
  display:none;align-items:center;justify-content:center;
  z-index:900;
}
.setBox{background:#e8e8e8;padding:22px;border-radius:10px}
body.dark .setBox{background:#282828}

/* win98窗口样式 */
.win98-window{position:absolute;border:2px solid #000;background:#c0c0c0;color:#000;min-width:280px;min-height:200px;overflow:hidden;z-index:50}
.win98-title{background:#000080;color:#fff;padding:4px 8px;display:flex;justify-content:space-between;align-items:center}
.win98-body{padding:8px;color:#000}

/* 游戏层 别墅里面的怪物 */
#gameLayer{
  position:fixed;inset:0;
  background:#0b0b10;
  display:none;
  z-index:100;
}
/* 虚拟摇杆 */
#joystickWrap{
  position:absolute;left:26px;bottom:26px;
  width:120px;height:120px;
  background:rgba(255,255,255,0.12);
  border-radius:50%;
}
#joystickKnob{
  width:50px;height:50px;
  background:rgba(255,255,255,0.35);
  border-radius:50%;
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
}
#sprintBtn{
  position:absolute;right:26px;bottom:26px;
  width:90px;height:90px;
  border-radius:50%;
  background:rgba(220,30,30,0.45);
  color:white;border:none;font-size:14px;
}

/* 游戏内物体 */
#inGameVilla{
  position:absolute;left:50%;top:40%;
  width:360px;height:280px;
  background:#222436;
  transform:translate(-50%,-50%);
}
#bedObj{
  position:absolute;left:54%;top:62%;
  width:110px;height:70px;
  background:#444;
}
#jumpScareMonster{
  position:fixed;inset:0;background:#000;
  display:none;z-index:200;
}
#victoryBox{
  position:fixed;inset:0;background:rgba(0,0,0,0.85);
  color:white;display:none;
  z-index:210;
  align-items:center;justify-content:center;
  flex-direction:column;gap:16px;
}
</style>
</head>
<body class="dark">
<div id="mainPage">
  <div id="viewWrap">
    <div id="scene">
      <div class="villaBg"></div>
      <div class="monsterSprite"></div>
    </div>
    <div id="menuUi">
      <!--左上角：编辑器、CMD按钮 -->
      <div class="topLeftBar">
        <button class="btn btnBlue" onclick="openEditorViewer()">HTML编辑套装</button>
        <button class="btn btnGray" onclick="openSelectMenu()">练习cmd & 学习语言</button>
      </div>
      <div class="topBar">
        <button class="btn btnGray" onclick="openSettings()">设置</button>
      </div>
      <div class="mainButtons">
        <button class="btn btnBlue" onclick="startOfflineGame()">开始游玩别墅里的怪物 Offline</button>
        <button class="btn btnBlue">PLAY</button>
        <button class="btn btnGray">STORE</button>
      </div>
    </div>
  </div>
</div>

<!-- 设置弹窗 -->
<div id="settingModal">
  <div class="setBox">
    <h3>主题设置</h3>
    <br>
    <button class="btn btnBlue" onclick="setLight()">白色模式</button>
    <button class="btn btnGray" onclick="setDark()">深色模式</button>
    <br><br>
    <button class="btn" onclick="closeSettings()">关闭</button>
  </div>
</div>

<!--弹窗容器 -->
<div id="modalMask" style="position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:9999">
<div id="modalBox" style="background:#c0c0c0;border:2px solid #000;padding:16px;min-width:300px"></div>
</div>

<!-- 游戏层：别墅里面的怪物 -->
<div id="gameLayer">
  <div id="inGameVilla"></div>
  <div id="bedObj"></div>

  <!-- 摇杆 -->
  <div id="joystickWrap">
    <div id="joystickKnob"></div>
  </div>
  <button id="sprintBtn">疾跑</button>

  <!-- 突脸怪物 -->
  <div id="jumpScareMonster"></div>

  <!-- 通关弹窗 -->
  <div id="victoryBox">
    <h2>游戏成功</h2>
    <button class="btn btnBlue" onclick="backToMenu()">继续</button>
  </div>
</div>

<script>
// ========== 拖拽弹簧回弹主页面视角 ==========
const scene = document.getElementById("scene");
let dragStartX=0,dragStartY=0;
let offsetX=0,offsetY=0;
let isDrag=false;

document.getElementById("viewWrap").addEventListener("touchstart",e=>{
  const t = e.touches[0];
  dragStartX = t.clientX - offsetX;
  dragStartY = t.clientY - offsetY;
  isDrag=true;
  scene.style.transition="none";
})
document.getElementById("viewWrap").addEventListener("touchmove",e=>{
  if(!isDrag) return;
  const t = e.touches[0];
  offsetX = t.clientX - dragStartX;
  offsetY = t.clientY - dragStartY;
  scene.style.transform=`translate(${offsetX}px,${offsetY}px)`;
})
document.getElementById("viewWrap").addEventListener("touchend",()=>{
  isDrag=false;
  //弹簧回弹回到原点
  offsetX=0;offsetY=0;
  scene.style.transition="transform 0.24s cubic-bezier(0.17, 0.67, 0.25, 1)";
  scene.style.transform="translate(0px,0px)";
})

// ========== 设置 深色浅色 ==========
function openSettings(){
  document.getElementById("settingModal").style.display="flex";
}
function closeSettings(){
  document.getElementById("settingModal").style.display="none";
}
function setLight(){
  document.body.className="light";
}
function setDark(){
  document.body.className="dark";
}

// ========== Win98窗口工具集 ==========
let winEditor=null,winPreview=null;
const mask=document.getElementById("modalMask");
const mbox=document.getElementById("modalBox");

function closeModal(){mask.style.display="none"}

function createWin98Window(title,html){
    const div=document.createElement("div");
    div.className="win98-window";
    div.style.left="20px";div.style.top="120px";div.style.width="340px";div.style.height="300px";
    div.innerHTML=`
    <div class="win98-title">${title}<span onclick="this.parentElement.parentElement.remove()">X</span></div>
    <div class="win98-body">${html}</div>
    `;
    document.body.appendChild(div);
    return div;
}

function openEditorViewer(){
    if(!winEditor){
        winEditor=createWin98Window("编辑器","<textarea style='width:100%;height:220px' id='codeInput'><h1>zk</h1></textarea><br><button onclick='renderPreview()'>刷新预览</button>");
    }
    if(!winPreview){
        winPreview=createWin98Window("index.html View","<div id='previewOut'></div>");
    }
}
function renderPreview(){
    const code=document.getElementById("codeInput").value||"";
    document.getElementById("previewOut").innerHTML=code;
}

function openSelectMenu(){
    mbox.innerHTML=`
    <h3>请选择</h3>
    <button onclick="openCmd()">cmd</button>
    <button onclick="openLearnDesktop()">学习语言</button>
    <br><br>
    <button onclick="closeModal()">取消</button>
    `;
    mask.style.display="flex";
}

function openCmd(){
    closeModal();
    createWin98Window("WinCMD",`
    <div style="font-family:monospace;background:#000;color:#0f0;padding:6px;height:220px;overflow:auto" id="cmdCon">
System Massage: C:/Windows/Wine/System32/Admin>
    </div>
    <input id="cmdIn" style="width:100%" placeholder="输入命令">
    `);
}
function openLearnDesktop(){
    closeModal();
    createWin98Window("学习语言桌面","<p>MicroSimu Edge</p><button>文件</button> <button>编辑</button> <button>寻求帮助</button>");
}

// ========== 进入游戏：只有点击这个按钮才全屏+横屏 ==========
async function startOfflineGame(){
  //浏览器限制：必须点击触发全屏横屏
  try{
    await document.documentElement.requestFullscreen();
  }catch(e){}
  if(screen.orientation?.lock){
    try{
      await screen.orientation.lock("landscape");
    }catch(e){}
  }
  document.getElementById("mainPage").style.display="none";
  document.getElementById("gameLayer").style.display="block";

  //模拟：进入别墅，怪物突脸
  setTimeout(()=>{
    const scare=document.getElementById("jumpScareMonster");
    scare.style.display="block";
    setTimeout(()=>{
      scare.style.display="none";
      //走到床触发通关
      setTimeout(()=>{
        document.getElementById("victoryBox").style.display="flex";
      },1200);
    },700);
  },1200);
}

// 返回主菜单，退出全屏解锁屏幕方向
async function backToMenu(){
  if(document.exitFullscreen) document.exitFullscreen();
  if(screen.orientation?.unlock) screen.orientation.unlock();
  document.getElementById("gameLayer").style.display="none";
  document.getElementById("victoryBox").style.display="none";
  document.getElementById("jumpScareMonster").style.display="none";
  document.getElementById("mainPage").style.display="block";
}
</script>
</body>
</html>
