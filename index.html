<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="utf‑8">
<meta name="viewport" content="width=device‑width,initial‑scale=1">
<title>DD的个人官网</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Segoe UI}
body{background:#151722;color:#ffffff;height:100vh;overflow:hidden}
/* 主页面 */
.main-page{padding:40px 20px}
h1{font-size:46px;margin-bottom:12px}
.desc{color:#94a3b8;margin-bottom:30px}
.btn{
  background:#0078d4;color:white;border:none;
  padding:12px 22px;font-size:16px;border-radius:4px;
  cursor:pointer;margin-right:10px;margin-bottom:10px;
}
.btn:hover{background:#218be0}

/* Win98窗口通用样式 */
.win98-window{
  position:absolute;background:#c0c0c0;border:2px solid;
  border-top-color:#ffffff;border-left-color:#ffffff;
  border-right-color:#404040;border-bottom-color:#404040;
  min-width:420px;min-height:320px;display:none;z-index:100;color:#000
}
.win98-titlebar{
  background:#000080;color:white;padding:3px 6px;
  display:flex;justify-content:space-between;align-items:center;
  font-weight:bold;font-size:14px;user-select:none;
}
.win98-close{
  background:#c0c0c0;color:black;border:1px solid;
  border-top-color:#ffffff;border-left-color:#ffffff;
  border-right-color:#404040;border-bottom:#404040;
  width:18px;height:18px;cursor:pointer;text-align:center;line-height:16px;
}
.win98-body{padding:8px;color:#000}
textarea{
  width:100%;height:220px;background:white;color:black;
  border:2px solid;border-top:#404040;border-left:#404040;
  border-right:#ffffff;border-bottom:#ffffff;padding:6px;
  font-family:monospace;font-size:13px;resize:none;
}
.preview-box{
  width:100%;height:220px;background:white;border:2px solid;
  border-top:#404040;border-left:#404040;
  border-right:#ffffff;border-bottom:#ffffff;overflow:auto;
}
/* CMD窗口样式 */
.cmd-box{
  background:#000;color:#0f0;height:260px;padding:8px;
  font-family:Consolas,monospace;overflow-y:auto;white-space:pre-wrap;
}
.cmd-input{width:100%;margin-top:6px;padding:4px}
/* 弹窗选择面板 */
.select-modal{
  position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);
  display:none;align-items:center;justify-content:center;z-index:200;
}
.select-panel{
  background:#c0c0c0;border:2px outset #fff;padding:20px;
}
/* Edge模拟浏览器顶部菜单栏 */
.edge-menubar{
  display:flex;gap:20px;padding:4px 8px;background:#ddd;border-bottom:2px inset #666;
}
.edge-menubar span{cursor:pointer;padding:2px 6px}
.edge-content{margin-top:8px;height:240px;border:inset 2px #666;padding:6px;overflow:auto}
</style>
</head>
<body>
<div class="main-page">
  <h1>DD666253</h1>
  <p class="desc">我的个人开发主页</p>
  <button class="btn" onclick="openAllWindows()">打开HTML编辑套装</button>
  <button class="btn" onclick="openStudySelect()">练习CMD & 编程语言学习</button>
</div>

<!-- 弹窗：选择CMD或者语言学习 -->
<div class="select-modal" id="selectPop">
  <div class="select-panel">
    <h3>请选择功能</h3>
    <br>
    <button class="btn" onclick="openCmdWin();closeSelect()">Win CMD模拟器</button>
    <button class="btn" onclick="openLangDesktop();closeSelect()">进入语言学习模拟桌面</button>
    <button class="btn" onclick="closeSelect()">取消</button>
  </div>
</div>

<!-- HTML编辑器窗口 -->
<div class="win98-window" id="winEditor" style="left:20px;top:100px;width:480px;height:340px">
  <div class="win98-titlebar">
    <span>HTML 编辑器</span>
    <div class="win98-close" onclick="closeWin('winEditor')">×</div>
  </div>
  <div class="win98-body">
    <textarea id="codeInput" placeholder="在这里编写HTML代码...">
<!DOCTYPE html>
<html>
<head>
<title>测试页面</title>
</head>
<body>
<h2>测试内容</h2>
<p>在这里修改代码</p>
</body>
</html>
    </textarea>
  </div>
</div>

<!-- HTML预览窗口 -->
<div class="win98-window" id="winPreview" style="left:540px;top:100px;width:480px;height:340px">
  <div class="win98-titlebar">
    <span>index.html View</span>
    <div class="win98-close" onclick="closeWin('winPreview')">×</div>
  </div>
  <div class="win98-body">
    <div class="preview-box" id="previewFrame"></div>
  </div>
</div>

<!-- Win CMD模拟窗口 -->
<div class="win98-window" id="winCmd" style="left:30px;top:120px;width:520px;height:360px">
  <div class="win98-titlebar">
    <span>Windows CMD</span>
    <div class="win98-close" onclick="closeWin('winCmd')">×</div>
  </div>
  <div class="win98-body">
    <div class="cmd-box" id="cmdOut">C:\Users\DD></div>
    <input class="cmd-input" id="cmdIn" placeholder="输入命令回车执行" onkeydown="runCmd(event)">
  </div>
</div>

<!-- 语言学习桌面+MicroSimu Edge浏览器 -->
<div class="win98-window" id="winLang" style="left:100px;top:80px;width:650px;height:420px">
  <div class="win98-titlebar">
    <span id="langWinTitle">Language Study Desktop</span>
    <div class="win98-close" onclick="closeWin('winLang')">×</div>
  </div>
  <div class="win98-body">
    <p id="langTip">Default Language: English</p>
    <button class="btn" onclick="switchLang()">切换中英文</button>
    <button class="btn" onclick="openEdge()">打开MicroSimu Edge</button>
    <!-- Edge浏览器面板 -->
    <div id="edgeBox" style="display:none;margin-top:10px;border:outset 2px #aaa">
      <div class="edge-menubar">
        <span onclick="edgeSave()">文件</span>
        <span onclick="edgeEdit()">编辑</span>
        <span onclick="edgeHelp()">寻求帮助</span>
      </div>
      <div class="edge-content" id="edgeContent"></div>
    </div>
  </div>
</div>

<script>
// 全局变量
let isCn = false;
// 一键打开编辑器+预览双窗口
function openAllWindows(){
  document.getElementById("winEditor").style.display="block";
  document.getElementById("winPreview").style.display="block";
  renderPreview();
}
//关闭任意窗口
function closeWin(id){
  document.getElementById(id).style.display="none";
}
// 选择弹窗开关
function openStudySelect(){
  document.getElementById("selectPop").style.display="flex";
}
function closeSelect(){
  document.getElementById("selectPop").style.display="none";
}
// CMD窗口开启
function openCmdWin(){
  document.getElementById("winCmd").style.display="block";
}
//语言桌面初始化，自动检测浏览器系统语言
function openLangDesktop(){
  let sysLang = navigator.language || navigator.userLanguage;
  isCn = sysLang.startsWith("zh");
  refreshLangUI();
  document.getElementById("winLang").style.display="block";
}
//语言切换按钮
function switchLang(){
  isCn = !isCn;
  refreshLangUI();
}
function refreshLangUI(){
  let titleDom = document.getElementById("langWinTitle");
  let tipDom = document.getElementById("langTip");
  if(isCn){
    titleDom.innerText = "编程语言学习桌面";
    tipDom.innerText = "当前语言：中文";
  }else{
    titleDom.innerText = "Language Study Desktop";
    tipDom.innerText = "Current Language: English";
  }
}
//唤起模拟Edge浏览器
function openEdge(){
  document.getElementById("edgeBox").style.display="block";
  document.getElementById("edgeContent").innerText = "Edge模拟器加载完成";
}
//edge菜单栏功能
function edgeSave(){
  alert("执行：保存 edge.isc");
}
function edgeEdit(){
  let longHtml = "html://edge\n".repeat(4000);
  document.getElementById("edgeContent").innerText = longHtml;
}
function edgeHelp(){
  let opt = prompt("1:语言学习页面 | 2:返回官网主页\n输入序号");
  if(opt=="1"){
    document.getElementById("edgeContent").innerText = "在这里学习各类编程语言";
  }else if(opt=="2"){
    closeWin("winLang");
  }
}

//代码编辑器实时预览
const codeInput=document.getElementById("codeInput");
const previewFrame=document.getElementById("previewFrame");
function renderPreview(){
  const code=codeInput.value;
  previewFrame.innerHTML=code;
}
codeInput.addEventListener("input",renderPreview);

//简易CMD模拟命令
function runCmd(e){
  if(e.key!="Enter") return;
  let input = document.getElementById("cmdIn").value.trim();
  let outBox = document.getElementById("cmdOut");
  outBox.innerText += "\nC:\\Users\\DD>"+input;
  //内置简易cmd指令
  switch(input.toLowerCase()){
    case "cls": outBox.innerText = "C:\\Users\\DD>";break;
    case "ver": outBox.innerText += "\nWindows 98 Sim Build 1998";break;
    case "dir": outBox.innerText += "\nindex.html\tedge.isc\treadme.md";break;
    default: outBox.innerText += `\n'${input}' 不是内部或外部命令`;
  }
  document.getElementById("cmdIn").value="";
  outBox.scrollTop = outBox.scrollHeight;
}
</script>
</body>
</html>
