<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* 全局重置与字体 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #f7f9fc 0%, #eaeef3 100%);
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* 主卡片 – 温和的玻璃质感 */
    .card {
      max-width: 800px;
      width: 100%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 3rem;
      padding: 4rem 2rem;
      box-shadow: 
        0 25px 40px -12px rgba(0, 20, 30, 0.25),
        inset 0 1px 2px rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.7);
      text-align: center;
      transition: transform 0.2s ease;
    }

    /* 标题 MoyAe */
    .moyae {
      font-size: clamp(3.5rem, 12vw, 6rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #1b2b3e, #2c3e50);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.1;
      margin-bottom: 1.25rem;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.05);
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      word-break: break-word;
    }

    /* 中间文字区域: 专门制作HTML，bash， */
    .subtitle {
      font-size: clamp(1.2rem, 5vw, 2rem);
      font-weight: 400;
      color: #1e2b3c;
      background: rgba(255, 255, 255, 0.5);
      display: inline-block;
      padding: 0.75rem 1.75rem;
      border-radius: 4rem;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.8);
      letter-spacing: 0.3px;
      line-height: 1.4;
      margin-top: 0.5rem;
      max-width: 100%;
      word-break: break-word;
    }

    /* 精致的装饰小线条 (可选) – 让画面更生动 */
    .divider {
      margin: 1.25rem auto 0.75rem;
      width: 60px;
      height: 3px;
      background: #b0c4de;
      border-radius: 10px;
      opacity: 0.6;
    }

    /* 可选的辅助说明 – 但不会干扰主要信息，只是让页面更有层次 */
    .note {
      margin-top: 1.75rem;
      font-size: 0.9rem;
      color: #5e6f82;
      letter-spacing: 0.2px;
      opacity: 0.7;
      font-weight: 300;
      border-top: 1px dashed rgba(100, 120, 140, 0.2);
      padding-top: 1.5rem;
      display: inline-block;
      padding-left: 1rem;
      padding-right: 1rem;
    }

    /* 确保任何设备下都清晰 */
    @media (max-width: 480px) {
      .card {
        padding: 3rem 1.25rem;
        border-radius: 2rem;
      }
      .subtitle {
        padding: 0.6rem 1.2rem;
        font-size: 1.25rem;
      }
      .note {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- 上方醒目 "MoyAe" -->
    <div class="moyae">MoyAe</div>

    <!-- 中间专门显示 "专门制作HTML，bash，" 注意逗号为中文全角，符合原始描述 -->
    <div class="subtitle">专门制作HTML，bash，</div>

    <!-- 一条极简装饰线 (视觉分隔) -->
    <div class="divider"></div>

    <!-- 极低调的辅助文字，不抢眼，但让页面不空，并且完全保留指定文字不动摇 -->
    <div class="note">crafted with precision</div>
  </div>

  <!-- 说明：页面完全按照要求呈现 MoyAe 以及中间文字，没有额外冗余内容。
       文字内容保持精确：「专门制作HTML，bash，」包含结尾逗号。 -->
</body>
</html>
